<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go On - Connect Randomly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Go On</h1>
        <div class="controls">
            <label>I am: 
                <select id="myGender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </label>
            <label>Match with: 
                <select id="targetGender">
                    <option value="any">Everyone</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
            </label>
            <button id="startBtn" onclick="startMatch()">Start</button>
            <button id="skipBtn" onclick="skipMatch()" disabled>Skip Next</button>
        </div>
    </header>

    <main class="main-container">
        <!-- Video Grid -->
        <section class="video-section">
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <span class="label">Stranger</span>
            </div>
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <span class="label">You</span>
            </div>
        </section>

        <!-- Side-by-Side Chat Box -->
        <section class="chat-section">
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-wrapper">
                <input type="text" id="msgInput" placeholder="Type a message..." disabled>
                <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>
</html>
